    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EGMWJKX6M4');

      window.addEventListener('DOMContentLoaded', function () {
        if (window.location.hostname !== 'www.canberraroofkind.com.au') return;

        document.addEventListener('click', function (event) {
          var link = event.target instanceof Element ? event.target.closest('a') : null;
          if (!link) return;
          var href = link.getAttribute('href') || '';
          if (href.indexOf('tel:') === 0) gtag('event', 'phone_click', { contact_method: 'phone' });
          if (href.indexOf('mailto:') === 0) gtag('event', 'email_click', { contact_method: 'email' });
          if (link.classList.contains('contactTop')) gtag('event', 'contact_cta_click', { contact_method: 'contact_cta' });
        });

        var formStatus = document.querySelector('.contactStatus');
        if (formStatus) new MutationObserver(function () {
          if (formStatus.textContent.trim() === 'Enquiry sent successfully.' && formStatus.dataset.ga4Tracked !== 'true') {
            formStatus.dataset.ga4Tracked = 'true';
            gtag('event', 'generate_lead', { form_name: 'roof_enquiry' });
          }
          if (formStatus.textContent.trim() !== 'Enquiry sent successfully.') delete formStatus.dataset.ga4Tracked;
        }).observe(formStatus, { childList: true, characterData: true, subtree: true });
      });
    </script>
